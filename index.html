<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - BTB Dashboard</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-text">Behind The<br/>Business</div>
      </div>

      <h1>Sign in</h1>
      <p class="subtitle">Welcome back. Enter your credentials to continue.</p>

      <form id="loginForm" class="login-form">
        <label>
          <span>Username</span>
          <input type="text" id="username" placeholder="admin" autocomplete="username" required />
        </label>

        <label>
          <span>Password</span>
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required />
        </label>

        <div class="error-msg" id="errorMsg"></div>

        <button type="submit" class="login-btn">Sign in</button>
      </form>

      <p class="hint">Demo credentials: <code>admin</code> / <code>btb2026</code></p>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
